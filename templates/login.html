<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Disruption Response Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="gate-body">
  <div class="gate-card">
    <img src="/static/img/logo-light.png" alt="Disruption Response Assistant" class="gate-logo">
    <h1>Operator Access</h1>
    <p class="gate-sub">Sign in to the impact workspace.</p>

    <form id="gate-form" class="gate-form">
      <label for="operator-id" class="visually-hidden">Operator ID</label>
      <input id="operator-id" type="text" placeholder="Operator ID" autocomplete="off">

      <label for="passphrase" class="visually-hidden">Passphrase</label>
      <input id="passphrase" type="password" placeholder="Passphrase" autocomplete="off">

      <button type="submit" class="btn-primary gate-submit">Enter Workspace</button>
    </form>

    <p class="gate-note">Demo access - no account needed, any input continues.</p>
  </div>

  <script>
    document.getElementById("gate-form").addEventListener("submit", (e) => {
      e.preventDefault();
      window.location.href = "/app";
    });
  </script>
</body>
</html>
